# DEMO TEMPORAL: ejecutar únicamente con docker compose -f docker-compose.demo.yml.
# PuntoMarket: desarrollo local. No usar DevIdentity como identidad de producción.
name: puntomarket

# INTEGRACIÓN: Añadir servicios reales con su base/red propias y su cluster YARP;
# no reutilizar la base de Proveedores ni inventar rutas de Usuarios.
services:
  mongodb:
    image: mongo:8.0.38-noble
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    # Compass local usa 27018; no se conecta ni copia el MongoDB de Windows en 27017.
    # Sin autenticación exclusivamente para esta demo local, con publicación loopback.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27028}:27017"
    # La segunda red solo habilita el puerto loopback de Compass; ninguna otra app se conecta a ella.
    networks: [datos-proveedores, compass-local]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand({ping:1}).ok !== 1) quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  identity-dev:
    build: ./DevIdentity/DevIdentity.Demo
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Emisor estable visible desde el host; el descubrimiento interno anuncia JWKS interno.
      DevIdentity__Issuer: "http://localhost:${DEV_IDENTITY_PORT:-15300}/realms/proveedores-dev"
      DevIdentity__Audience: proveedores-api
    ports:
      - "127.0.0.1:${DEV_IDENTITY_PORT:-15300}:8080"
    networks: [aplicaciones]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  proveedores-api:
    build: ./Servicio4.Proveedores
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Swagger__Enabled: "true"
      Mongo__ConnectionString: mongodb://mongodb:27017
      Mongo__DatabaseName: proveedores_db
      Mongo__ProveedoresCollection: proveedores
      Mongo__InitializeOnStartup: "true"
      Mongo__SeedEnabled: "true"
      Authentication__Jwt__Authority: "http://localhost:${DEV_IDENTITY_PORT:-15300}/realms/proveedores-dev"
      Authentication__Jwt__MetadataAddress: http://identity-dev:8080/realms/proveedores-dev/.well-known/openid-configuration
      Authentication__Jwt__Audience: proveedores-api
      Authentication__Jwt__RequireHttpsMetadata: "false"
      ProductosApi__Enabled: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      identity-dev:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROVEEDORES_API_PORT:-15200}:8080"
    networks: [aplicaciones, datos-proveedores]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  gateway:
    build: ./ApiGateway/ApiGateway.Demo
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # INTEGRACIÓN: Mantener las rutas de appsettings; cambiar solo destinos por DNS de Compose.
      ReverseProxy__Clusters__proveedores-cluster__Destinations__proveedores-api__Address: http://proveedores-api:8080/
      ReverseProxy__Clusters__dev-identity-cluster__Destinations__dev-identity__Address: http://identity-dev:8080/
    depends_on:
      proveedores-api:
        condition: service_healthy
      identity-dev:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-15000}:8080"
    networks: [aplicaciones]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build: ./Frontend/Frontend.Demo
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ApiGateway__BaseUrl: http://gateway:8080/
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-15100}:8080"
    networks: [aplicaciones]
    volumes:
      # Mantiene cookies/antiforgery válidos tras recrear el frontend; no son claves incluidas en Git.
      - frontend_keys:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  aplicaciones:
  datos-proveedores:
    internal: true
  compass-local:

volumes:
  mongodb_data:
  frontend_keys:
