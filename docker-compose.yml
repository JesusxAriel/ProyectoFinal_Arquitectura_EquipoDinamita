name: puntomarket-microservicios

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Defina KEYCLOAK_ADMIN_USER en el archivo .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD en el archivo .env}
      PUNTOMARKET_ADMIN_USERNAME: ${PUNTOMARKET_ADMIN_USERNAME:?Defina PUNTOMARKET_ADMIN_USERNAME en el archivo .env}
      PUNTOMARKET_ADMIN_PASSWORD: ${PUNTOMARKET_ADMIN_PASSWORD:?Defina PUNTOMARKET_ADMIN_PASSWORD en el archivo .env}
      PUNTOMARKET_ADMIN_EMAIL: ${PUNTOMARKET_ADMIN_EMAIL:?Defina PUNTOMARKET_ADMIN_EMAIL en el archivo .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PUBLISHED_PORT:-8180}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/realm-puntomarket.json:/opt/keycloak/data/import/realm-puntomarket.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          while read -r linea; do [[ $$linea == *'"status": "UP"'* ]] && exit 0; done <&3
          exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  gateway:
    build:
      context: ./Gateway
    environment:
      Authentication__Jwt__Authority: http://keycloak:8080/realms/puntomarket
      Authentication__Jwt__RequireHttpsMetadata: "false"
    depends_on:
      keycloak:
        condition: service_healthy
      usuarios-ms:
        condition: service_healthy
      clientes-ms:
        condition: service_healthy
      productos-ms:
        condition: service_healthy
      proveedores-ms:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${GATEWAY_PUBLISHED_PORT:-5000}:8080"

  frontend:
    build:
      context: ./Frontend
    environment:
      GatewayApi__BaseUrl: http://gateway:8080/
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /Auth/Login HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r linea <&3
          [[ $$linea == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${FRONTEND_PUBLISHED_PORT:-5100}:8080"

  usuarios-ms:
    build:
      context: ./Servicio2.Usuarios
    environment:
      ConnectionStrings__MySqlConnection: Server=usuarios-db;Port=3306;Database=${USUARIOS_DB_NAME:?Defina USUARIOS_DB_NAME en el archivo .env};User ID=${USUARIOS_DB_USER:?Defina USUARIOS_DB_USER en el archivo .env};Password=${USUARIOS_DB_PASSWORD:?Defina USUARIOS_DB_PASSWORD en el archivo .env}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-}
      Smtp__UserName: ${SMTP_USER_NAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Activacion__BaseUrl: ${ACTIVACION_BASE_URL:-http://localhost:5100}
      Activacion__VigenciaMinutos: ${ACTIVACION_VIGENCIA_MINUTOS:-60}
      Authentication__Jwt__Authority: http://keycloak:8080/realms/puntomarket
      Authentication__Jwt__Audience: usuarios-api
      Authentication__Jwt__RequireHttpsMetadata: "false"
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Realm: puntomarket
      Keycloak__LoginClientId: puntomarket-web
      Keycloak__AdminUserName: ${KEYCLOAK_ADMIN_USER:?Defina KEYCLOAK_ADMIN_USER en el archivo .env}
      Keycloak__AdminPassword: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD en el archivo .env}
    depends_on:
      keycloak:
        condition: service_healthy
      usuarios-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /api/salud HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r linea <&3
          [[ $$linea == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${USUARIOS_PUBLISHED_PORT:-5003}:8080"

  clientes-ms:
    build:
      context: ./Servicio1.Clientes
    environment:
      ConnectionStrings__MySqlConnection: Server=clientes-db;Port=3306;Database=${CLIENTES_DB_NAME:?Defina CLIENTES_DB_NAME en el archivo .env};User ID=${CLIENTES_DB_USER:?Defina CLIENTES_DB_USER en el archivo .env};Password=${CLIENTES_DB_PASSWORD:?Defina CLIENTES_DB_PASSWORD en el archivo .env}
      Authentication__Jwt__Authority: http://keycloak:8080/realms/puntomarket
      Authentication__Jwt__Audience: clientes-api
      Authentication__Jwt__RequireHttpsMetadata: "false"
      Authentication__Jwt__RoleClaimPaths__0: realm_access.roles
      Authentication__Jwt__RoleMapping__Administrador__0: Administrador
      Authentication__Jwt__RoleMapping__Cajero__0: Cajero
    depends_on:
      keycloak:
        condition: service_healthy
      clientes-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /api/salud HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r linea <&3
          [[ $$linea == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${CLIENTES_PUBLISHED_PORT:-5001}:8080"

  productos-ms:
    build:
      context: ./Servicio3.Productos
    environment:
      ConnectionStrings__PostgresConnection: Host=productos-db;Port=5432;Database=${PRODUCTOS_DB_NAME:?Defina PRODUCTOS_DB_NAME en el archivo .env};Username=${PRODUCTOS_DB_USER:?Defina PRODUCTOS_DB_USER en el archivo .env};Password=${PRODUCTOS_DB_PASSWORD:?Defina PRODUCTOS_DB_PASSWORD en el archivo .env}
      Productos__SeedEnabled: "true"
      ProveedoresApi__BaseUrl: http://proveedores-ms:8080/
      Authentication__Jwt__Authority: http://keycloak:8080/realms/puntomarket
      Authentication__Jwt__Audience: productos-api
      Authentication__Jwt__RequireHttpsMetadata: "false"
    depends_on:
      keycloak:
        condition: service_healthy
      productos-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /api/salud HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r linea <&3
          [[ $$linea == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${PRODUCTOS_PUBLISHED_PORT:-5004}:8080"

  proveedores-ms:
    build:
      context: ./Servicio4.Proveedores
    environment:
      Mongo__ConnectionString: mongodb://${PROVEEDORES_DB_USER:?Defina PROVEEDORES_DB_USER en el archivo .env}:${PROVEEDORES_DB_PASSWORD:?Defina PROVEEDORES_DB_PASSWORD en el archivo .env}@proveedores-db:27017/?authSource=admin
      Mongo__DatabaseName: ${PROVEEDORES_DB_NAME:?Defina PROVEEDORES_DB_NAME en el archivo .env}
      Authentication__Jwt__Authority: http://keycloak:8080/realms/puntomarket
      Authentication__Jwt__Audience: proveedores-api
      Authentication__Jwt__RequireHttpsMetadata: "false"
      Authentication__Jwt__RoleClaimPaths__0: realm_access.roles
      Authentication__Jwt__RoleMapping__Administrador__0: Administrador
      Authentication__Jwt__RoleMapping__Cajero__0: Cajero
    depends_on:
      keycloak:
        condition: service_healthy
      proveedores-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r linea <&3
          [[ $$linea == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${PROVEEDORES_PUBLISHED_PORT:-5005}:8080"

  usuarios-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${USUARIOS_DB_ROOT_PASSWORD:?Defina USUARIOS_DB_ROOT_PASSWORD en el archivo .env}
      MYSQL_DATABASE: ${USUARIOS_DB_NAME}
      MYSQL_USER: ${USUARIOS_DB_USER}
      MYSQL_PASSWORD: ${USUARIOS_DB_PASSWORD}
      PUNTOMARKET_ADMIN_USERNAME: ${PUNTOMARKET_ADMIN_USERNAME:?Defina PUNTOMARKET_ADMIN_USERNAME en el archivo .env}
      PUNTOMARKET_ADMIN_EMAIL: ${PUNTOMARKET_ADMIN_EMAIL:?Defina PUNTOMARKET_ADMIN_EMAIL en el archivo .env}
      PUNTOMARKET_ADMIN_NOMBRE: ${PUNTOMARKET_ADMIN_NOMBRE:-}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${USUARIOS_DB_PUBLISHED_PORT:-3308}:3306"
    volumes:
      - usuarios-db-data:/var/lib/mysql
      - ./Servicio2.Usuarios/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  productos-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PRODUCTOS_DB_NAME}
      POSTGRES_USER: ${PRODUCTOS_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCTOS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PRODUCTOS_DB_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - productos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  clientes-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${CLIENTES_DB_ROOT_PASSWORD:?Defina CLIENTES_DB_ROOT_PASSWORD en el archivo .env}
      MYSQL_DATABASE: ${CLIENTES_DB_NAME}
      MYSQL_USER: ${CLIENTES_DB_USER}
      MYSQL_PASSWORD: ${CLIENTES_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${CLIENTES_DB_PUBLISHED_PORT:-3310}:3306"
    volumes:
      - clientes-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  proveedores-db:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PROVEEDORES_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PROVEEDORES_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${PROVEEDORES_DB_NAME}
    ports:
      - "127.0.0.1:${PROVEEDORES_DB_PUBLISHED_PORT:-27018}:27017"
    volumes:
      - proveedores-db-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

volumes:
  keycloak-data: {}
  usuarios-db-data: {}
  productos-postgres-data: {}
  clientes-mysql-data: {}
  proveedores-db-data: {}
